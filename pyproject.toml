# ---- Project Info and Dependencies ----

[project.urls]
Repository = "https://github.com/jlevy/deep-transcribe"
# Homepage = "https://..."
# Documentation = "https://..."

[project]
name = "deep-transcribe"
description = "High-quality transcription, formatting, and analysis of videos and podcasts"
authors = [
    { name="Joshua Levy", email="joshua@cal.berkeley.edu" },
]
readme = "README.md"
license = "AGPL-3.0-or-later"
# kash-media currently requires Python 3.13 exactly (>=3.13,<3.14).
requires-python = ">=3.13,<3.14"
dynamic = ["version"]

# https://pypi.org/classifiers/
# Adjust as needed:
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    # Include this to avoid accidentally publishing to PyPI:
    # "Private :: Do Not Upload",
]


# ---- Main dependencies ----

dependencies = [
    # The media chain no longer pulls PDF/browser ML deps (torch, docling,
    # playwright, marker); keep it that way — deep-transcribe needs none of them.
    "kash-media>=0.4.4,<0.5",
    # Direct metadata parsing and sidematter persistence imports:
    "frontmatter-format>=0.4.0,<0.5",
    "sidematter-format>=0.1.0,<0.2",
    # Direct imports of these (prettyfmt for paths, rich for terminal output):
    "prettyfmt>=0.4.1",
    "rich>=14.0.0",
    # Not imported here — yt-dlp arrives via kash-media. Named directly only to pull
    # the `default` extra, which carries yt-dlp-ejs, the external-JavaScript solver
    # YouTube's signature and `n` challenges now require. Without it yt-dlp runs
    # degraded (it drops progressive formats such as 18 and warns on every fetch), and
    # the only other way to get the solver is `--remote-components ejs:github|npm`,
    # which fetches JavaScript at run time outside uv.lock and outside the cool-off.
    # Take it as an extra rather than pinning yt-dlp-ejs ourselves: the two are
    # version-coupled (yt-dlp pins an exact ejs), so this keeps the pairing correct
    # across upgrades. Needs a JS runtime on PATH — deno (preferred), node, or bun.
    "yt-dlp[default]>=2026.8.19",
]


# ---- Dev dependencies ----

[dependency-groups]
build = [
    "hatchling==1.31.0",
    "uv-dynamic-versioning==0.14.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.16.2",
    "codespell>=2.4.3",
    "rich>=15.0.0",
    "basedpyright>=1.39.9",
    "funlog>=0.2.1",
]

[tool.uv.sources]
# For bleeding edge:
# kash-media = { git = "https://github.com/jlevy/kash-media.git" }
# kash-docs = { git = "https://github.com/jlevy/kash-docs.git" }
# kash-shell = { git = "https://github.com/jlevy/kash-shell.git" }
# For local development:
# kash-media = { path = "../kash-media", editable = true }

[project.scripts]
# Add script entry points here.
deep-transcribe = "deep_transcribe.cli_main:main"


# ---- Build system ----

# Dynamic versioning from:
# https://github.com/ninoseki/uv-dynamic-versioning/

[build-system]
requires = ["hatchling==1.31.0", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
# Note JSON schemas don't seem to be right for tool.hatch.version.source so
# this may cause false warnings in IDEs.
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.hatch.build.targets.wheel]
# The source location for the package.
packages = ["src/deep_transcribe"]


# ---- Settings ----

[tool.uv]
# Fail fast on old uv versions rather than misbehave. 0.9 is the floor where
# exclude-newer accepts a relative duration like "14 days".
required-version = ">=0.9"
# Safe project-level default for every uv command. CI and the Makefile repeat it so
# copied commands and tool execution outside project discovery retain the same policy.
exclude-newer = "14 days"
# Security floor: Pillow < 12.3.0 is vulnerable (PYSEC-2026-2254/2256/2257). 12.3.0 is
# now older than the rolling cool-off, so it no longer needs an exclude-newer exception;
# this floor stays to block any transitive downgrade.
constraint-dependencies = ["pillow>=12.3.0"]

[tool.uv.exclude-newer-package]
# Packages owned and released by jlevy bypass the third-party cool-off.
# Keep this list a superset of the personal uv config (~/.config/uv/uv.toml): project
# settings take precedence over user settings, so listing every first-party name here
# keeps `uv.lock` byte-identical on a dev machine and in CI. Names not currently in the
# dependency tree are harmless and stop the lock from drifting if one appears later.
chopdiff = "2099-12-31T00:00:00Z"
clideps = "2099-12-31T00:00:00Z"
deep-transcribe = "2099-12-31T00:00:00Z"
flexdoc = "2099-12-31T00:00:00Z"
flowmark-rs = "2099-12-31T00:00:00Z"
flowmark = "2099-12-31T00:00:00Z"
frontmatter-format = "2099-12-31T00:00:00Z"
funlog = "2099-12-31T00:00:00Z"
kash-docs = "2099-12-31T00:00:00Z"
kash-media = "2099-12-31T00:00:00Z"
kash-shell = "2099-12-31T00:00:00Z"
kpress = "2099-12-31T00:00:00Z"
metabrowser = "2099-12-31T00:00:00Z"
pprose = "2099-12-31T00:00:00Z"
prettyfmt = "2099-12-31T00:00:00Z"
sidematter-format = "2099-12-31T00:00:00Z"
softschema = "2099-12-31T00:00:00Z"
strif = "2099-12-31T00:00:00Z"
tminify = "2099-12-31T00:00:00Z"

# Reviewed third-party exceptions. Each is a hard cutoff, not a floor, so it pins how
# fresh that package may be and must be re-reviewed (and the date bumped) on every
# dependency refresh — otherwise it silently freezes the package at an old release.
#
# yt-dlp tracks YouTube's extractor changes and breaks in the field within weeks of a
# site change, so a 14-day cool-off costs more than it buys here. Kept as short-lived
# and deliberate: bump to just past the newest stable release, never to a date in the
# future, and never onto a `.devN` nightly. Reviewed 2026-08-24 for 2026.8.19.
yt-dlp = "2026-08-20T00:00:00Z"

[tool.ruff]
# Set as desired, typically 88 (black standard) or 100 (wide).
line-length = 100

[tool.ruff.lint]
select = [
    # See: https://docs.astral.sh/ruff/rules/
    # Basic list from: https://docs.astral.sh/ruff/linter/#rule-selection
    "E", # https://docs.astral.sh/ruff/rules/#error-e
    "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "I", # https://docs.astral.sh/ruff/rules/#isort-i
    # Other possibilities:
    # "D", # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    # "Q", # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    # "COM", # https://docs.astral.sh/ruff/rules/#flake8-commas-com
    # "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim

]
ignore = [
    # Disable some rules that are overly pedantic. Add/remove as desired:
    "E501", # https://docs.astral.sh/ruff/rules/line-too-long/
    "E402", # https://docs.astral.sh/ruff/rules/module-import-not-at-top-of-file/
    "E731", # https://docs.astral.sh/ruff/rules/lambda-assignment/
    # We use both ruff formatter and linter so some rules should always be disabled.
    # See: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", # https://docs.astral.sh/ruff/rules/tab-indentation/
    "E111", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple/
    "E114", # https://docs.astral.sh/ruff/rules/indentation-with-invalid-multiple-comment/
    "E117", # https://docs.astral.sh/ruff/rules/over-indented/
    "D206", # https://docs.astral.sh/ruff/rules/docstring-tab-indentation/
    "D300", # https://docs.astral.sh/ruff/rules/triple-single-quotes/
    "Q000", # https://docs.astral.sh/ruff/rules/bad-quotes-inline-string/
    "Q001", # https://docs.astral.sh/ruff/rules/bad-quotes-multiline-string/
    "Q002", # https://docs.astral.sh/ruff/rules/bad-quotes-docstring/
    "Q003", # https://docs.astral.sh/ruff/rules/avoidable-escaped-quote/
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "COM819", # https://docs.astral.sh/ruff/rules/prohibited-trailing-comma/
    "ISC002", # https://docs.astral.sh/ruff/rules/multi-line-implicit-string-concatenation/
]

[tool.basedpyright]
# BasedPyright currently seems like the best type checker option, much faster
# than mypy and with a good extension for VSCode/Cursor.
# https://marketplace.visualstudio.com/items?itemName=detachhead.basedpyright
# https://docs.basedpyright.com/latest/configuration/config-files/#sample-pyprojecttoml-file
include = ["src", "tests", "devtools"]
# By default BasedPyright is very strict, so you almost certainly want to disable
# some of the rules.
# First, these turn off warnings about (yes) how you ignore warnings:
reportIgnoreCommentWithoutRule = false
reportUnnecessaryTypeIgnoreComment = false
# A few typically noisy warnings are next.
# How many you enable is up to you. The first few are off by default, but you can
# comment/uncomment these as desired:
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportUnreachable = false
# reportPrivateImportUsage = false
# reportPrivateLocalImportUsage = false
# reportMissingImports = false
# reportUnnecessaryIsInstance = false
reportUnknownVariableType = false
# reportUnknownArgumentType = false

[tool.codespell]
# Add here as needed:
# ignore-words-list = "foo,bar"
# skip = "foo.py,bar.py"

[tool.pytest.ini_options]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = [
    "src",
    "tests",
]
norecursedirs = []
filterwarnings = []
